name: Fork image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact WAHA source commit to build
        required: true
        type: string
      image_tag:
        description: Immutable GHCR tag, for example core-2026.7.2-c615c7a8dbe0
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/henocdejesusferreirafarias/waha

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]

      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            USE_BROWSER=chromium
            WHATSAPP_DEFAULT_ENGINE=WEBJS
          load: true
          push: false
          tags: waha-fork-smoke:${{ inputs.source_sha }}

      - name: Smoke-test HTTP startup
        shell: bash
        run: |
          docker run -d --name waha-fork-smoke --rm -p 3000:3000 \
            -e WAHA_API_KEY=test \
            -e WHATSAPP_DEFAULT_ENGINE=WEBJS \
            waha-fork-smoke:${{ inputs.source_sha }}
          trap 'docker rm --force waha-fork-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --header 'X-Api-Key: test' http://127.0.0.1:3000/api/sessions >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs waha-fork-smoke
          exit 1

      - name: Publish immutable candidate
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            USE_BROWSER=chromium
            WHATSAPP_DEFAULT_ENGINE=WEBJS
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          provenance: mode=max
          sbom: true

      - name: Record immutable reference
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
